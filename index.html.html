    projectId: "cmsuedafrika",

    appId: "1:901423680719:web:7bfd5bc8bb0f57b9aafbba"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  function subscribeKey(key, cb) {
    return db.collection("cm_travel_data").doc(key).onSnapshot(
      (snap) => cb(snap.exists ? snap.data().value : undefined),
      (err) => { console.error("Firestore read error", key, err); cb(undefined); }
    );
  }
  function writeKey(key, value) {
    db.collection("cm_travel_data").doc(key).set({ value, updatedAt: Date.now() })
      .catch((err) => console.error("Firestore write error", key, err));
  }
</script>

/* ---------------------------------------------------------------

----------------------------------------------------------------*/
function fmtKey(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
const TRIP_START = new Date(2026, 11, 1);
const TRIP_END = new Date(2026, 11, 19);
function tripDates() {
  const days = []; const cur = new Date(TRIP_START);
  while (cur <= TRIP_END) { days.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }
  return days;
}
const TRIP_START_KEY = fmtKey(TRIP_START);
const TRIP_END_KEY = fmtKey(TRIP_END);

function EmojiBurst({ active, emojis, mode = "rise" }) {
  if (!active) return null;
  const anim = mode === "drift" ? "driftFade" : "riseFade";
  return (
    <>
      {emojis.map((e, i) => (
        <span key={i} className="burst-particle" style={{ left: `${20 + i * 15}%`, animation: `${anim} ${0.75 + i * 0.06}s ease-out ${i * 0.05}s both` }}>{e}</span>
      ))}
    </>
  );
}

function StarRating({ value = 0, onChange, size = 22, readOnly = false, color = COLORS.wine }) {
  const stars = [1, 2, 3, 4, 5];
  return (
    <div className="flex items-center gap-0.5" style={{ lineHeight: 0 }}>
      {stars.map((n) => {
        const filled = value >= n;
        const half = !filled && value >= n - 0.5;
        return (
          <div key={n} className="relative" style={{ width: size, height: size }}>
            <Star size={size} color={color} fill="none" strokeWidth={1.75} style={{ position: "absolute", inset: 0 }} />
            {half && <div style={{ position: "absolute", inset: 0, width: "50%", overflow: "hidden" }}><Star size={size} color={color} fill={color} strokeWidth={1.75} /></div>}
            {filled && <Star size={size} color={color} fill={color} strokeWidth={1.75} style={{ position: "absolute", inset: 0 }} />}
            {!readOnly && onChange && (
              <>
                <button type="button" aria-label={`${n - 0.5} Sterne`} className="absolute top-0 left-0 h-full" style={{ width: "50%" }} onClick={() => onChange(n - 0.5)} />
                <button type="button" aria-label={`${n} Sterne`} className="absolute top-0 right-0 h-full" style={{ width: "50%" }} onClick={() => onChange(n)} />
              </>
            )}
          </div>
        );
      })}
    </div>
  );
}

const PLANNER_KEY = "planner:items";

function SendToPlanner({ item, cityKey }) {
  const [open, setOpen] = useState(false);
  const [date, setDate] = useState(TRIP_START_KEY);
  const [sent, setSent] = useState(false);
  const send = () => {
    db.collection("cm_travel_data").doc(PLANNER_KEY).get().then((snap) => {
      const current = (snap.exists && snap.data().value) ? snap.data().value : [];
      const next = [...current, { id: Date.now().toString(36), date, text: item.text, done: false, source: cityKey }];
      writeKey(PLANNER_KEY, next);
    });
    setSent(true); setOpen(false); setTimeout(() => setSent(false), 1800);
  };
  return (
    <div className="relative">
      <button onClick={() => setOpen((o) => !o)} className="shrink-0 flex items-center justify-center" style={{ color: sent ? COLORS.fynbos : COLORS.inkSoft, width: 22, height: 22 }} aria-label="An Tagesplaner senden" title="An Tagesplaner senden">
        {sent ? <Check size={16} /> : <CalendarPlus size={16} />}
      </button>
      {open && (
        <div className="absolute right-0 top-7 z-20 rounded-md p-2.5 flex flex-col gap-2" style={{ background: COLORS.paper, border: `1px solid ${COLORS.creamDark}`, boxShadow: "0 6px 18px rgba(42,37,33,0.15)", width: 178 }}>
          <label style={{ fontFamily: "Inter, sans-serif", fontSize: 11.5, color: COLORS.inkSoft }}>Tag im Planer</label>
          <input type="date" value={date} min={TRIP_START_KEY} max={TRIP_END_KEY} onChange={(e) => setDate(e.target.value)} className="rounded px-2 py-1.5 outline-none" style={{ border: `1px solid ${COLORS.creamDark}`, fontFamily: "JetBrains Mono, monospace", fontSize: 12.5, background: COLORS.cream }} />
          <div className="flex gap-1.5">
            <button onClick={() => setOpen(false)} className="flex-1 rounded py-1.5" style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: COLORS.inkSoft, background: COLORS.cream }}>Abbrechen</button>
            <button onClick={send} className="flex-1 rounded py-1.5" style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: COLORS.paper, background: COLORS.ink }}>Senden</button>
          </div>
        </div>
      )}
    </div>
  );
}

  useEffect(() => {
    const unsub = subscribeKey(storageKey, (d) => setItems(d || []));
    return unsub;
  }, [storageKey]);

  const persist = useCallback((next) => { setItems(next); writeKey(storageKey, next); }, [storageKey]);

  const add = () => { const t = text.trim(); if (!t) return; persist([...(items || []), { id: Date.now().toString(36), text: t, done: false }]); setText(""); };
  const toggle = (id) => {
    const target = (items || []).find((i) => i.id === id);
    const willBeDone = target && !target.done;
    persist((items || []).map((i) => (i.id === id ? { ...i, done: !i.done } : i)));
    if (willBeDone) { setBurstId(id); setTimeout(() => setBurstId((b) => (b === id ? null : b)), 900); }
  };
  const remove = (id) => persist((items || []).filter((i) => i.id !== id));

  const done = (items || []).filter((i) => i.done).length;
  const total = (items || []).length;

      <GlobalStyle />
      <div className="relative">
        <Banner />
        <button onClick={onBack} className="absolute top-4 left-4 flex items-center gap-1.5 px-2.5 py-1 rounded-full" style={{ background: "rgba(251,248,241,0.85)", color: COLORS.ink, fontFamily: "Inter, sans-serif", fontSize: 12.5 }}>
          <ArrowLeft size={14} /> Journal
        </button>
        <div className="absolute bottom-3 left-5 right-5 flex items-center gap-2.5">
          <div className="flex items-center justify-center rounded-full shrink-0" style={{ width: 38, height: 38, background: cfg.accent, color: COLORS.paper }}><cfg.icon size={18} /></div>
          <div>
            <h1 style={{ fontFamily: "Fraunces, serif", fontSize: 22, fontWeight: 700, color: COLORS.ink, textShadow: "0 1px 6px rgba(251,248,241,0.6)" }}>{cfg.title}</h1>
            <p style={{ fontFamily: "Inter, sans-serif", fontSize: 12.5, color: COLORS.inkSoft }}>{total ? `${done} von ${total} erledigt` : "Noch nichts geplant"}</p>
          </div>
        </div>
      </div>
      <div className="px-5 pt-5 pb-10">
        <div className="flex gap-2 mb-5">
          <input value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} placeholder="Was steht an?" className="flex-1 rounded-md px-3.5 py-2.5 outline-none" style={{ background: COLORS.paper, border: `1px solid ${COLORS.creamDark}`, fontFamily: "Inter, sans-serif", fontSize: 14.5, color: COLORS.ink }} />
          <button onClick={add} className="rounded-md flex items-center justify-center shrink-0" style={{ width: 44, background: cfg.accent, color: COLORS.paper }} aria-label="Hinzufügen"><Plus size={19} /></button>
        </div>
        {items === null && <p style={{ fontFamily: "Inter, sans-serif", fontSize: 13, color: COLORS.inkSoft }}>Lädt …</p>}
        {items !== null && items.length === 0 && (
          <div className="text-center py-14" style={{ fontFamily: "Inter, sans-serif" }}>
            <p style={{ fontSize: 14, color: COLORS.inkSoft }}>Die Liste ist leer.</p>
            <p style={{ fontSize: 13, color: COLORS.inkSoft, opacity: 0.75, marginTop: 2 }}>Trag oben ein, was ihr euch für {cfg.title} vornehmt.</p>
          </div>
        )}
        <div className="flex flex-col gap-2">
          {(items || []).map((item) => (
            <div key={item.id} className="relative flex items-center gap-3 rounded-md px-3.5 py-3" style={{ background: COLORS.paper, border: `1px solid ${COLORS.creamDark}` }}>
              <div className="relative">
                <button onClick={() => toggle(item.id)} className="shrink-0 rounded-full flex items-center justify-center" style={{ width: 21, height: 21, border: `1.75px solid ${item.done ? cfg.accent : COLORS.inkSoft}`, background: item.done ? cfg.accent : "transparent" }} aria-label={item.done ? "Als offen markieren" : "Als erledigt markieren"}>
                  {item.done && <div style={{ width: 8, height: 8, borderRadius: "50%", background: COLORS.paper }} />}
                </button>
                <EmojiBurst active={burstId === item.id} emojis={cfg.doneEmojis} mode={cfg.burstMode} />
              </div>
              <span style={{ flex: 1, fontFamily: "Inter, sans-serif", fontSize: 14.5, color: item.done ? COLORS.inkSoft : COLORS.ink, textDecoration: item.done ? "line-through" : "none", wordBreak: "break-word" }}>{item.text}</span>
              <SendToPlanner item={item} cityKey={cityKey} />
              <button onClick={() => remove(item.id)} className="shrink-0" style={{ color: COLORS.inkSoft }} aria-label="Löschen"><Trash2 size={16} /></button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

const BG_KEY = "backgammon:data";
const DEFAULT_BG = { C: 0, M: 0, history: [] };
function Stone({ player, size = 84 }) {
  const isC = player === "C";
  return <div style={{ width: size, height: size, borderRadius: "50%", background: isC ? "radial-gradient(circle at 35% 30%, #ffffff, #ddd6c8 70%, #c9bfa8 100%)" : "radial-gradient(circle at 35% 30%, #4a433d, #201c19 70%, #100e0c 100%)", border: isC ? `2px solid ${COLORS.creamDark}` : "2px solid #000", boxShadow: isC ? "inset 0 -6px 10px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.15)" : "inset 0 -6px 10px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.35)" }} />;
}
function PenguinClap({ active }) {
  if (!active) return null;
  return (
    <div style={{ position: "absolute", top: -6, left: "50%", zIndex: 6, pointerEvents: "none", animation: "penguinBounce 0.9s ease" }}>
      <span style={{ fontSize: 30, display: "inline-block" }}>🐧</span>
      <span style={{ fontSize: 16, display: "inline-block", marginLeft: 2, animation: "clapWiggle 0.45s ease 3" }}>👏</span>
      <EmojiBurst active emojis={["✨", "✨", "✨"]} mode="rise" />
    </div>
  );
}
function BackgammonApp({ onBack }) {
  const [data, setData] = useState(null);
  const [pulse, setPulse] = useState(null);
  const [customOpen, setCustomOpen] = useState(null);
  const [customVal, setCustomVal] = useState("");
  const [editOpen, setEditOpen] = useState(null);
  const [editVal, setEditVal] = useState("");

  useEffect(() => { const unsub = subscribeKey(BG_KEY, (d) => setData(d || { ...DEFAULT_BG })); return unsub; }, []);
  const persist = (next) => { setData(next); writeKey(BG_KEY, next); };

  const addPoints = (player, pts) => {
    if (!data || !pts) return;
    const next = { ...data, [player]: data[player] + pts, history: [{ player, pts, ts: Date.now(), kind: "add" }, ...data.history].slice(0, 40) };
    persist(next);
    if (pts > 0) { const key = Date.now().toString(36); setPulse({ player, key }); setTimeout(() => setPulse((p) => (p && p.key === key ? null : p)), 950); }
  };
  const setExact = (player, val) => {
    if (!data || Number.isNaN(val)) return;
    const next = { ...data, [player]: val, history: [{ player, pts: val, ts: Date.now(), kind: "set" }, ...data.history].slice(0, 40) };
    persist(next);
  };
  const resetMatch = () => persist({ ...DEFAULT_BG });

  if (!data) return (<div className="min-h-full" style={{ background: COLORS.cream }}><AppHeader title="Backgammon" icon={Dices} accent={COLORS.ink} onBack={onBack} /><p className="px-5" style={{ fontFamily: "Inter, sans-serif", fontSize: 13, color: COLORS.inkSoft }}>Lädt …</p></div>);

  return (
    <div className="min-h-full" style={{ background: COLORS.cream }}>
      <GlobalStyle />
      <AppHeader title="Backgammon" subtitle="Punktestand für C & M" icon={Dices} accent={COLORS.ink} onBack={onBack} />
      <div className="px-5 pb-10">
        <div className="grid grid-cols-2 gap-3 mb-6">
          {["C", "M"].map((player) => {
            const isPulsing = pulse && pulse.player === player;
            const isEditing = editOpen === player;
            return (
              <div key={player} className="relative rounded-lg flex flex-col items-center py-6 gap-4" style={{ background: COLORS.paper, border: `1px solid ${COLORS.creamDark}` }}>
                <PenguinClap active={isPulsing} />
                <div style={isPulsing ? { animation: "ringGlow 0.9s ease-out", borderRadius: "50%" } : undefined}>
                  <div style={isPulsing ? { animation: "stonePulse 0.55s cubic-bezier(.34,1.56,.64,1)" } : undefined}><Stone player={player} /></div>
                </div>
                <div className="text-center">
                  <div style={{ fontFamily: "Fraunces, serif", fontSize: 15, fontWeight: 600, color: COLORS.ink }}>{player}</div>
                  {isEditing ? (
                    <div className="flex items-center gap-1 mt-1">
                      <input autoFocus value={editVal} onChange={(e) => setEditVal(e.target.value.replace(/[^0-9]/g, ""))} className="text-center outline-none rounded" style={{ width: 60, fontFamily: "JetBrains Mono, monospace", fontSize: 24, border: `1px solid ${COLORS.creamDark}`, background: COLORS.cream }} />
                      <button onClick={() => { setExact(player, parseInt(editVal || "0", 10)); setEditOpen(null); }} style={{ color: COLORS.fynbos }} aria-label="Übernehmen"><Check size={18} /></button>
                    </div>
                  ) : (
                    <button onClick={() => { setEditOpen(player); setEditVal(String(data[player])); }} className="flex items-center gap-1 justify-center" title="Stand korrigieren">
                      <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 38, fontWeight: 700, color: COLORS.ink, lineHeight: 1 }}>{data[player]}</span>
                      <Pencil size={12} color={COLORS.inkSoft} />
                    </button>
                  )}
                </div>
                <div className="flex gap-1.5 flex-wrap justify-center px-2">
                  {[1, 2, 3].map((p) => <button key={"plus" + p} onClick={() => addPoints(player, p)} className="rounded-full px-3 py-1.5" style={{ background: COLORS.cream, border: `1px solid ${COLORS.creamDark}`, fontFamily: "JetBrains Mono, monospace", fontSize: 13, color: COLORS.fynbos }}>+{p}</button>)}
                </div>
                <div className="flex gap-1.5 flex-wrap justify-center px-2">
                  {[1, 2, 3].map((p) => <button key={"minus" + p} onClick={() => addPoints(player, -p)} className="rounded-full px-3 py-1.5" style={{ background: COLORS.cream, border: `1px solid ${COLORS.creamDark}`, fontFamily: "JetBrains Mono, monospace", fontSize: 13, color: COLORS.wine }}>−{p}</button>)}
                  <button onClick={() => setCustomOpen(customOpen === player ? null : player)} className="rounded-full px-3 py-1.5" style={{ background: COLORS.cream, border: `1px solid ${COLORS.creamDark}`, fontFamily: "JetBrains Mono, monospace", fontSize: 13, color: COLORS.inkSoft }}>…</button>
                </div>
                {customOpen === player && (
                  <div className="flex gap-1.5 px-2">
                    <input autoFocus value={customVal} onChange={(e) => setCustomVal(e.target.value.replace(/[^0-9-]/g, ""))} placeholder="±Punkte" className="w-20 rounded-md px-2 py-1.5 outline-none" style={{ background: COLORS.cream, border: `1px solid ${COLORS.creamDark}`, fontFamily: "JetBrains Mono, monospace", fontSize: 13 }} />
                    <button onClick={() => { const n = parseInt(customVal, 10); if (!Number.isNaN(n) && n !== 0) addPoints(player, n); setCustomVal(""); setCustomOpen(null); }} className="rounded-md px-2.5 py-1.5" style={{ background: COLORS.ink, color: COLORS.paper, fontSize: 12.5, fontFamily: "Inter, sans-serif" }}>OK</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <button onClick={resetMatch} className="flex items-center gap-1.5 mx-auto mb-8" style={{ fontFamily: "Inter, sans-serif", fontSize: 12.5, color: COLORS.inkSoft }}><RotateCcw size={13} /> Match zurücksetzen</button>
        {data.history.length > 0 && (
          <div>
            <SectionLabel>Verlauf</SectionLabel>
            <div className="flex flex-col gap-1.5">
              {data.history.slice(0, 10).map((h, idx) => (
                <div key={h.ts + "-" + idx} className="flex items-center justify-between rounded-md px-3 py-2" style={{ background: COLORS.paper, border: `1px solid ${COLORS.creamDark}` }}>
                  <span style={{ fontFamily: "Inter, sans-serif", fontSize: 13, color: COLORS.ink }}>{h.kind === "set" ? `${h.player} korrigiert auf ${h.pts}` : `${h.player} ${h.pts > 0 ? "bekommt" : "verliert"} ${Math.abs(h.pts)} Punkt${Math.abs(h.pts) > 1 ? "e" : ""}`}</span>
                  <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 11, color: COLORS.inkSoft }}>{new Date(h.ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const WINE_KEY = "wine:estates";

function emptyEstate() { return { id: Date.now().toString(36), name: "", ratings: { lage: 0, architektur: 0, anlage: 0, kueche: 0, gesamt: 0 }, wines: [] }; }

  const updateEstate = (id, patch) => persist((estates || []).map((e) => (e.id === id ? { ...e, ...patch } : e)));
  const updateRating = (id, key, val) => persist((estates || []).map((e) => (e.id === id ? { ...e, ratings: { ...e.ratings, [key]: val } } : e)));
  const removeEstate = (id) => persist((estates || []).filter((e) => e.id !== id));

  const removeWine = (estateId, wineId) => persist((estates || []).map((e) => (e.id === estateId ? { ...e, wines: e.wines.filter((w) => w.id !== wineId) } : e)));

                    <button onClick={() => removeEstate(e.id)} style={{ color: COLORS.inkSoft }} aria-label="Weingut löschen"><Trash2 size={16} /></button>

                          </div>
                          <StarRating value={w.rating} onChange={(v) => updateWine(e.id, w.id, { rating: v })} size={17} color={COLORS.gold} />
                          <textarea value={w.notes} onChange={(ev) => updateWine(e.id, w.id, { notes: ev.target.value })} placeholder="Tasting notes …" rows={2} className="w-full mt-2 outline-none rounded-md px-2.5 py-2 resize-none" style={{ background: COLORS.paper, border: `1px solid ${COLORS.creamDark}`, fontFamily: "Inter, sans-serif", fontSize: 13, color: COLORS.ink }} />
                        </div>
                      ))}
                    </div>
                    <button onClick={() => addWine(e.id)} className="flex items-center gap-1.5 mt-3" style={{ fontFamily: "Inter, sans-serif", fontSize: 13, color: COLORS.wine }}><Plus size={14} /> Wein hinzufügen</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

const RESTAURANT_KEY = "restaurant:list";
const REST_CRITERIA = [{ key: "geschmack", label: "Geschmack" }, { key: "zutaten", label: "Zutaten" }, { key: "raffinesse", label: "Raffinesse" }, { key: "abwechslung", label: "Abwechslung" }, { key: "ambiente", label: "Ambiente" }];
function emptyRestaurant() { return { id: Date.now().toString(36), name: "", ratings: { geschmack: 0, zutaten: 0, raffinesse: 0, abwechslung: 0, ambiente: 0 }, notes: "" }; }
function avg(ratings) { const vals = Object.values(ratings); const s = vals.reduce((a, b) => a + b, 0); return vals.length ? s / vals.length : 0; }
function RestaurantApp({ onBack }) {
  const [list, setList] = useState(null);
  useEffect(() => { const unsub = subscribeKey(RESTAURANT_KEY, (d) => setList(d || [])); return unsub; }, []);
  const persist = (next) => { setList(next); writeKey(RESTAURANT_KEY, next); };
  const addRestaurant = () => persist([emptyRestaurant(), ...(list || [])]);
  const update = (id, patch) => persist((list || []).map((r) => (r.id === id ? { ...r, ...patch } : r)));
  const updateRating = (id, key, val) => persist((list || []).map((r) => (r.id === id ? { ...r, ratings: { ...r.ratings, [key]: val } } : r)));
  const remove = (id) => persist((list || []).filter((r) => r.id !== id));

  return (
    <div className="min-h-full" style={{ background: COLORS.cream }}>
      <AppHeader title="Restaurants" subtitle={`${(list || []).length} bewertet`} icon={UtensilsCrossed} accent={COLORS.gold} onBack={onBack} />
      <div className="px-5 pb-10">
        <button onClick={addRestaurant} className="w-full flex items-center justify-center gap-2 rounded-md py-3 mb-5" style={{ background: COLORS.ink, color: COLORS.paper, fontFamily: "Inter, sans-serif", fontSize: 14, fontWeight: 500 }}><Plus size={16} /> Neues Restaurant</button>
        {list === null && <p style={{ fontFamily: "Inter, sans-serif", fontSize: 13, color: COLORS.inkSoft }}>Lädt …</p>}
        {list !== null && list.length === 0 && <div className="text-center py-14" style={{ fontFamily: "Inter, sans-serif" }}><p style={{ fontSize: 14, color: COLORS.inkSoft }}>Noch kein Restaurant eingetragen.</p></div>}
        <div className="flex flex-col gap-3">
          {(list || []).map((r) => (
            <div key={r.id} className="rounded-lg px-4 pt-4 pb-4" style={{ background: COLORS.paper, border: `1px solid ${COLORS.creamDark}` }}>
              <div className="flex items-start gap-2">
                <input value={r.name} onChange={(ev) => update(r.id, { name: ev.target.value })} placeholder="Name des Restaurants" className="flex-1 outline-none bg-transparent" style={{ fontFamily: "Fraunces, serif", fontSize: 18, fontWeight: 600, color: COLORS.ink }} />
                <span style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 12.5, color: COLORS.gold, whiteSpace: "nowrap", paddingTop: 4 }}>Ø {avg(r.ratings).toFixed(1)}</span>
                <button onClick={() => remove(r.id)} style={{ color: COLORS.inkSoft }} aria-label="Löschen"><Trash2 size={16} /></button>
              </div>
              <div className="flex flex-col gap-2 mt-3">
                {REST_CRITERIA.map((c) => (
                  <div key={c.key} className="flex items-center justify-between">
                    <span style={{ fontFamily: "Inter, sans-serif", fontSize: 13, color: COLORS.inkSoft }}>{c.label}</span>
                    <StarRating value={r.ratings[c.key]} onChange={(v) => updateRating(r.id, c.key, v)} size={18} color={COLORS.gold} />
                  </div>
                ))}
              </div>
              <textarea value={r.notes} onChange={(ev) => update(r.id, { notes: ev.target.value })} placeholder="Notizen …" rows={2} className="w-full mt-3 outline-none rounded-md px-2.5 py-2 resize-none" style={{ background: COLORS.cream, border: `1px solid ${COLORS.creamDark}`, fontFamily: "Inter, sans-serif", fontSize: 13, color: COLORS.ink }} />
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

const LETTERS_KEY = "letters:list";
function emptyLetter(to) { return { id: Date.now().toString(36), from: to === "C" ? "M" : "C", to, title: "", body: "", date: Date.now(), opened: false }; }
function Envelope({ letter, onOpen, onRemove }) {
  const [open, setOpen] = useState(letter.opened);
  const accent = letter.to === "C" ? COLORS.sea : COLORS.wine;
  const toggle = () => { const next = !open; setOpen(next); if (next && !letter.opened) onOpen(letter.id); };
  return (
    <div className="rounded-lg overflow-hidden" style={{ border: `1px solid ${COLORS.creamDark}`, background: COLORS.paper }}>
      <button onClick={toggle} className="w-full flex items-center gap-3 px-4 py-3.5 text-left">
        <div className="flex items-center justify-center rounded-full shrink-0" style={{ width: 34, height: 34, background: `${accent}1f`, color: accent }}><Mail size={16} /></div>
        <div className="flex-1">
          <div style={{ fontFamily: "Fraunces, serif", fontSize: 15.5, fontWeight: 600, color: COLORS.ink }}>{letter.title || "Ohne Titel"}</div>
          <div style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: COLORS.inkSoft }}>Für {letter.to}{!open ? " · versiegelt" : ""}</div>
        </div>
        {open ? <ChevronUp size={16} color={COLORS.inkSoft} /> : <ChevronDown size={16} color={COLORS.inkSoft} />}
      </button>
      {open && (
        <div className="px-4 pb-4" style={{ borderTop: `1px dashed ${COLORS.creamDark}` }}>
          <p className="mt-3" style={{ fontFamily: "Inter, sans-serif", fontSize: 11.5, color: COLORS.inkSoft, letterSpacing: "0.04em", textTransform: "uppercase" }}>Von {letter.from}</p>
          <p className="mt-2 whitespace-pre-wrap" style={{ fontFamily: "Fraunces, serif", fontSize: 15.5, color: COLORS.ink, lineHeight: 1.55 }}>{letter.body}</p>
          <button onClick={() => onRemove(letter.id)} className="flex items-center gap-1.5 mt-4" style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: COLORS.inkSoft }}><Trash2 size={13} /> Löschen</button>
        </div>
      )}
    </div>
  );
}
function LettersApp({ onBack }) {
  const [letters, setLetters] = useState(null);
  const [composing, setComposing] = useState(false);
  const [draft, setDraft] = useState(emptyLetter("C"));
  useEffect(() => { const unsub = subscribeKey(LETTERS_KEY, (d) => setLetters(d || [])); return unsub; }, []);
  const persist = (next) => { setLetters(next); writeKey(LETTERS_KEY, next); };
  const startCompose = () => { setDraft(emptyLetter("C")); setComposing(true); };
  const send = () => { if (!draft.body.trim()) return; persist([{ ...draft, id: Date.now().toString(36), date: Date.now() }, ...(letters || [])]); setComposing(false); };
  const markOpened = (id) => persist((letters || []).map((l) => (l.id === id ? { ...l, opened: true } : l)));
  const remove = (id) => persist((letters || []).filter((l) => l.id !== id));

  return (
    <div className="min-h-full" style={{ background: COLORS.cream }}>
      <AppHeader title="Liebesbriefe" subtitle="Für C und M" icon={Heart} accent={COLORS.wineLight} onBack={onBack} />
      <div className="px-5 pb-10">
        {!composing && <button onClick={startCompose} className="w-full flex items-center justify-center gap-2 rounded-md py-3 mb-5" style={{ background: COLORS.wineLight, color: COLORS.paper, fontFamily: "Inter, sans-serif", fontSize: 14, fontWeight: 500 }}><Plus size={16} /> Neuer Brief</button>}
        {composing && (
          <div className="rounded-lg p-4 mb-5 flex flex-col gap-3" style={{ background: COLORS.paper, border: `1px solid ${COLORS.creamDark}` }}>
            <div className="flex items-center gap-2">
              <span style={{ fontFamily: "Inter, sans-serif", fontSize: 13, color: COLORS.inkSoft }}>Für:</span>
              {["C", "M"].map((p) => (
                <button key={p} onClick={() => setDraft((d) => ({ ...d, to: p, from: p === "C" ? "M" : "C" }))} className="rounded-full px-3.5 py-1.5" style={{ fontFamily: "JetBrains Mono, monospace", fontSize: 13, background: draft.to === p ? COLORS.wineLight : COLORS.cream, color: draft.to === p ? COLORS.paper : COLORS.ink, border: `1px solid ${draft.to === p ? COLORS.wineLight : COLORS.creamDark}` }}>{p}</button>
              ))}
              <span style={{ fontFamily: "Inter, sans-serif", fontSize: 12, color: COLORS.inkSoft, marginLeft: "auto" }}>von {draft.from}</span>
            </div>
            <input value={draft.title} onChange={(e) => setDraft((d) => ({ ...d, title: e.target.value }))} placeholder="Titel (optional)" className="outline-none rounded-md px-3 py-2" style={{ background: COLORS.cream, border: `1px solid ${COLORS.creamDark}`, fontFamily: "Fraunces, serif", fontSize: 15, color: COLORS.ink }} />
            <textarea value={draft.body} onChange={(e) => setDraft((d) => ({ ...d, body: e.target.value }))} placeholder="Deine Zeilen …" rows={6} className="outline-none rounded-md px-3 py-2 resize-none" style={{ background: COLORS.cream, border: `1px solid ${COLORS.creamDark}`, fontFamily: "Inter, sans-serif", fontSize: 14, color: COLORS.ink }} />
            <div className="flex gap-2">
              <button onClick={() => setComposing(false)} className="flex-1 rounded-md py-2.5" style={{ fontFamily: "Inter, sans-serif", fontSize: 13.5, color: COLORS.inkSoft, background: COLORS.cream }}>Abbrechen</button>
              <button onClick={send} className="flex-1 rounded-md py-2.5" style={{ fontFamily: "Inter, sans-serif", fontSize: 13.5, color: COLORS.paper, background: COLORS.wineLight, fontWeight: 500 }}>Versiegeln &amp; senden</button>
            </div>
          </div>
        )}
        {letters === null && <p style={{ fontFamily: "Inter, sans-serif", fontSize: 13, color: COLORS.inkSoft }}>Lädt …</p>}
        {letters !== null && letters.length === 0 && !composing && <div className="text-center py-14" style={{ fontFamily: "Inter, sans-serif" }}><p style={{ fontSize: 14, color: COLORS.inkSoft }}>Noch kein Brief hinterlegt.</p></div>}
        <div className="flex flex-col gap-2.5">
          {(letters || []).map((l) => <Envelope key={l.id} letter={l} onOpen={markOpened} onRemove={remove} />)}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("home");
  const navigate = (v) => setView(v);
  const back = () => setView("home");
  let content;
  if (view === "home") content = <Home navigate={navigate} />;
  else if (view.startsWith("todo:")) content = <TodoApp cityKey={view.split(":")[1]} onBack={back} />;
  else if (view === "planner") content = <PlannerApp onBack={back} />;
  else if (view === "backgammon") content = <BackgammonApp onBack={back} />;
  else if (view === "wine") content = <WineApp onBack={back} />;
  else if (view === "restaurant") content = <RestaurantApp onBack={back} />;
  else if (view === "letters") content = <LettersApp onBack={back} />;

  return (
    <div style={{ minHeight: "100vh", background: COLORS.cream }}>
      <div className="mx-auto" style={{ maxWidth: 480, minHeight: "100vh", background: COLORS.cream }}>{content}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
